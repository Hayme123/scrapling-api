services:
  api:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      WORKERS: "${WORKERS:-8}"
    init: true
    restart: unless-stopped
    shm_size: "2gb"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
